name: Deploy CRM to VPS

on:
  push:
    branches:
      - main
      - claude/check-contabo-connection-6w3Hm
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="/home/claudeprojetos/crmclinica"
            BRANCH="claude/check-contabo-connection-6w3Hm"
            REPO="https://github.com/drrodrigofranco/calculamed.git"

            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              mkdir -p "$PROJECT_DIR"
              git clone "$REPO" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            mkdir -p public

            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            npm ci
            npm run build
            cp -r dist/* public/

            echo "Deploy concluido: $(date)"
            ls -lh public/ | head -5
